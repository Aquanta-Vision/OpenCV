name: Release

# Builds OpenCV from the pinned upstream release (opencv.env) for every PAM platform, audits each
# build against SPEC's licensing rules, and on a tag publishes everything as a GitHub Release.
# Tag format: opencv-<OPENCV_VERSION>-pam.<N>, e.g. opencv-4.14.0-pam.1.
on:
  workflow_dispatch:
  push:
    tags: ['opencv-*']

permissions:
  contents: write
  # Pulls the private FLIR Poky toolchain image for linux-cortexa9t2hf.
  packages: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble source archive
        run: scripts/make_source.sh out

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: out/*-source.tar.xz

  # Built from the source archive, not the checkout, so the published source matches the binaries.
  # Each build runs in a container with the oldest glibc among that target's PAM consumers:
  # Ubuntu 22.04 for x86_64, Ubuntu 18.04 (SLA camera) for aarch64 on a native arm runner, and
  # FLIR's Poky 3.3 SDK image for cortexa9t2hf.
  # docker run instead of a job container: Node 24 actions don't run on Ubuntu 18.04's glibc.
  linux:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
            image: ubuntu:22.04
          - target: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:18.04
          - target: cortexa9t2hf
            runner: ubuntu-24.04
            image: ghcr.io/aquanta-vision/toolchain-poky-3.3-cortexa9t2hf:55
    runs-on: ${{ matrix.runner }}
    steps:
      # The Poky image is about 10 GB; drop preinstalled SDKs we don't use to make room.
      - name: Free disk space
        if: startsWith(matrix.image, 'ghcr.io/')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        if: startsWith(matrix.image, 'ghcr.io/')
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Extract source
        run: |
          tar -xJf *-source.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-opencv-*/)" >> "$GITHUB_ENV"

      # A new key per run so every run saves its cache; restore takes the newest one. ccache
      # checks every hit against the preprocessed source and compiler, so stale entries can't leak in.
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ccache-linux-${{ matrix.target }}-

      - name: Build and audit in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e CCACHE_DIR=/work/.ccache -e CCACHE_MAXSIZE=1G ${{ matrix.image }} \
            bash "${SOURCE_ROOT}pam-build/scripts/ci_linux.sh" ${{ matrix.target }} "$SOURCE_ROOT" out/linux-${{ matrix.target }}

      - name: Package
        run: XZ_OPT=-T0 tar -cJf "${SOURCE_ROOT%/}-linux-${{ matrix.target }}.tar.xz" -C out linux-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: pam-opencv-*-linux-${{ matrix.target }}.tar.xz

  # MSVC with Visual Studio's CMake and Ninja in Git Bash. arm64 is cross-compiled on x64, then
  # audited on an arm64 runner in windows-arm64-audit.
  windows:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            msvc_arch: x64
          - target: arm64
            msvc_arch: x64_arm64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Extract source
        run: |
          tar -xJf *-source.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-opencv-*/)" >> "$GITHUB_ENV"

      - name: Load MSVC ${{ matrix.msvc_arch }} environment
        shell: pwsh
        run: '& "$env:SOURCE_ROOT/pam-build/scripts/msvc_env.ps1" ${{ matrix.msvc_arch }}'

      - name: Build and audit
        run: '"${SOURCE_ROOT}pam-build/scripts/ci_windows.sh" ${{ matrix.target }} "$SOURCE_ROOT" out/windows-${{ matrix.target }}'

      - name: Package
        run: XZ_OPT=-T0 tar -cJf "${SOURCE_ROOT%/}-windows-${{ matrix.target }}.tar.xz" -C out windows-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.target }}
          path: pam-opencv-*-windows-${{ matrix.target }}.tar.xz

  # The x64 runner cannot execute arm64 binaries, so the arm64 build is audited here.
  windows-arm64-audit:
    needs: windows
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '{source,windows-arm64}'
          merge-multiple: true

      - name: Extract source and build
        run: |
          tar -xJf *-source.tar.xz
          tar -xJf *-windows-arm64.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-opencv-*/)" >> "$GITHUB_ENV"

      - name: Load MSVC arm64 environment
        shell: pwsh
        run: '& "$env:SOURCE_ROOT/pam-build/scripts/msvc_env.ps1" arm64'

      - name: Audit
        run: '"${SOURCE_ROOT}pam-build/scripts/audit_windows.sh" arm64 windows-arm64'

  # NDK and API level pinned in opencv.env to match PAM's Android build.
  android:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Extract source
        run: |
          tar -xJf *-source.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-opencv-*/)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-android-${{ matrix.abi }}-${{ github.run_id }}
          restore-keys: ccache-android-${{ matrix.abi }}-

      - name: Build and audit
        run: '"${SOURCE_ROOT}pam-build/scripts/ci_android.sh" ${{ matrix.abi }} "$SOURCE_ROOT" out/android-${{ matrix.abi }}'

      - name: Package
        run: XZ_OPT=-T0 tar -cJf "${SOURCE_ROOT%/}-android-${{ matrix.abi }}.tar.xz" -C out android-${{ matrix.abi }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: pam-opencv-*-android-${{ matrix.abi }}.tar.xz

  # arm64 runner; the x86_64 slice is cross-compiled and audited under Rosetta. iOS builds the
  # device and simulator slices into one archive. Same macOS image as PAM's Apple jobs.
  apple:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-universal, ios]
    runs-on: macos-26
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Extract source
        run: |
          tar -xJf *-source.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-opencv-*/)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-

      - name: Build and audit
        run: |
          case "${{ matrix.platform }}" in
            macos-universal) "${SOURCE_ROOT}pam-build/scripts/ci_macos.sh" "$SOURCE_ROOT" out/macos-universal ;;
            ios) "${SOURCE_ROOT}pam-build/scripts/ci_ios.sh" "$SOURCE_ROOT" out/ios ;;
          esac

      - name: Package
        run: XZ_OPT=-T0 tar -cJf "${SOURCE_ROOT%/}-${{ matrix.platform }}.tar.xz" -C out ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: pam-opencv-*-${{ matrix.platform }}.tar.xz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, linux, windows, windows-arm64-audit, android, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check tag matches opencv.env
        run: |
          source opencv.env
          [[ "$GITHUB_REF_NAME" =~ ^opencv-${OPENCV_VERSION//./\\.}-pam\.[0-9]+$ ]] || {
            echo "::error::tag $GITHUB_REF_NAME does not match OPENCV_VERSION=$OPENCV_VERSION"
            exit 1
          }

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes ""
